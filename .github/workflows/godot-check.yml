name: godot-check

# Batch 0 (prompt 9B): errors show up on GitHub without a PC. Downloads
# Godot 4.7.2 headless, imports the project (rebuilding the class cache),
# runs the logic tests (res://tests/run_tests.tscn) and the fast scene
# suites with isolated user dirs, fails on any failure, and uploads every
# report as an artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 (headless)
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Build identity check (staleness gate)
        run: bash tools/check_build_identity.sh

      - name: Import project (class cache + script parse)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Logic tests (run_tests)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/run_tests.tscn | tee /tmp/report-run_tests.log

      - name: Scene suites (fast set)
        run: |
          rc=0
          for t in smoke smoke_pose smoke_tpose smoke_progression smoke_combos; do
            rm -rf /tmp/ud-$t && mkdir -p /tmp/ud-$t
            echo "=== $t ===" | tee -a /tmp/report-scenes.log
            if HOME=/tmp/ud-$t timeout 300 ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/$t.tscn 2>&1 | tee -a /tmp/report-scenes.log; then
              echo "$t exit=0" | tee -a /tmp/report-scenes.log
            else
              echo "$t FAILED" | tee -a /tmp/report-scenes.log
              rc=1
            fi
          done
          exit $rc

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            /tmp/report-*.log
